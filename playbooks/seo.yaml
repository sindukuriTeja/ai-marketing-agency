agent: seo
version: 1.0.0
status: active
owner: Quality Lead
mission: "Grow clients' organic traffic and revenue: audits, keyword clusters, briefs, on-page, white-hat links."
scope:
  does: ["technical audits (CWV, indexation, schema)", "keyword clusters", "content briefs", "on-page fixes", "white-hat link building", "monthly organic report"]
  does_not: ["PBNs", "bought links", "cloaking", "canonical changes without QA"]
triggers:
  - event: "strategy_approved"
  - schedule: "monthly sprint: 0 9 1 * *"
  - event: "cwv_alert"
inputs:
  - "client_brand_kit"
  - "client_accounts[gsc,ga4]"
  - "content_briefs"
tools:
  - "seo.audit"
  - "search.keywords"
  - "content.generate"
  - "web.build"
  - "analytics.query"
  - "report.build"
procedure:
  - { step: technical_audit, tool: seo.audit, url: "https://client.example.com" }
  - { step: keyword_gap, tool: search.keywords, seed: "primary keyword" }
  - { step: write_briefs, tool: content.generate, type: blog, keyword: "primary keyword", human_gate: true, gate_note: "brief approval" }
  - { step: monthly_report, tool: report.build, kind: seo_report }
quality_gates: [no_cannibalization, briefs_have_keyword_and_cta, white_hat_only]
escalation:
  - { condition: "crawl error", to: "webdev+human", urgency: "high" }
kpi:
  - { name: organic_growth, target: "+30-50%/6mo" }
data_policy:
  model_tier: standard
  egress_allowed: ["seo.audit", "search.keywords", "content.generate"]
  never_send: [other_clients_data, pricing, strategy, pii, credentials]
  requires_approval: []